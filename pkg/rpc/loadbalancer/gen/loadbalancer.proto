syntax = "proto3";

package loadbalancer.v1;

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

option go_package = "github.com/kube-virt/loadbalancer-api/gen/loadbalancer/v1;loadbalancerv1";

// LoadBalancerService manages load balancer lifecycle.
service LoadBalancerService {
  // CreateLoadBalancer accepts a new load balancer request and persists it
  // with state PENDING. The provisioning IP is not returned at this stage.
  rpc CreateLoadBalancer(CreateLoadBalancerRequest) returns (CreateLoadBalancerResponse);

  // GetLoadBalancer returns the full detail of a single load balancer.
  rpc GetLoadBalancer(GetLoadBalancerRequest) returns (GetLoadBalancerResponse);

  // ListLoadBalancers returns a summary list. Optionally filtered by tenant.
  rpc ListLoadBalancers(ListLoadBalancersRequest) returns (ListLoadBalancersResponse);

  // DeleteLoadBalancer marks the resource as DELETING and returns immediately.
  rpc DeleteLoadBalancer(DeleteLoadBalancerRequest) returns (DeleteLoadBalancerResponse);

  // BatchDeleteLoadBalancers marks multiple resources as DELETING and returns per-item results.
  rpc BatchDeleteLoadBalancers(BatchDeleteLoadBalancersRequest) returns (BatchDeleteLoadBalancersResponse);

  // AllocateFloatingIp assigns (or re-assigns) a floating IP to a load balancer.
  // Sets fip_state to PROVISIONING. The LB must be in READY state.
  rpc AllocateFloatingIp(AllocateFloatingIpRequest) returns (AllocateFloatingIpResponse);

  // ReleaseFloatingIp initiates removal of the floating IP from a load balancer.
  // Sets fip_state to REMOVING.
  rpc ReleaseFloatingIp(ReleaseFloatingIpRequest) returns (ReleaseFloatingIpResponse);

  // UpdateLoadBalancer patches the configuration of an existing load balancer.
  // Only fields present in the request are updated. Unset fields are left
  // unchanged. If any spec field changes, the LB state is reset to PENDING so
  // that the controller re-provisions the resource.
  rpc UpdateLoadBalancer(UpdateLoadBalancerRequest) returns (UpdateLoadBalancerResponse);
}

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_PENDING = 1;
  STATE_PROVISIONING = 2;
  STATE_READY = 3;
  STATE_FAILED = 4;
  STATE_DELETING = 5;
  STATE_DELETED = 6;
  STATE_UPDATING = 7;
}

// Algorithm defines the load balancing strategy for distributing traffic
// across backend endpoints.
enum Algorithm {
  ALGORITHM_UNSPECIFIED = 0;
  ALGORITHM_ROUND_ROBIN = 1;
  ALGORITHM_LEAST_REQUEST = 2;
  ALGORITHM_RANDOM = 3;
  ALGORITHM_CONSISTENT_HASH = 4;
}

// Protocol defines the transport protocol for the load balancer listener.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
  PROTOCOL_HTTP = 3;
}

// FipState describes the lifecycle state of a floating IP assignment.
// HttpPathType defines how the path should be matched against HTTP request paths.
enum HttpPathType {
  HTTP_PATH_TYPE_UNSPECIFIED = 0;
  // HTTP_PATH_TYPE_EXACT matches the path exactly.
  HTTP_PATH_TYPE_EXACT = 1;
  // HTTP_PATH_TYPE_PREFIX matches paths with the given prefix.
  HTTP_PATH_TYPE_PREFIX = 2;
  // HTTP_PATH_TYPE_REGEX matches paths using a regular expression.
  HTTP_PATH_TYPE_REGEX = 3;
}

// HttpMethod defines the HTTP request method.
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET = 1;
  HTTP_METHOD_POST = 2;
  HTTP_METHOD_PUT = 3;
  HTTP_METHOD_DELETE = 4;
  HTTP_METHOD_PATCH = 5;
  HTTP_METHOD_HEAD = 6;
  HTTP_METHOD_OPTIONS = 7;
}

enum FipState {
  FIP_STATE_UNSPECIFIED = 0;
  // FIP_STATE_NONE means no floating IP is assigned or requested.
  FIP_STATE_NONE = 1;
  // FIP_STATE_PROVISIONING means an allocation request is in progress.
  FIP_STATE_PROVISIONING = 2;
  // FIP_STATE_ACTIVE means the floating IP is assigned and active.
  FIP_STATE_ACTIVE = 3;
  // FIP_STATE_REMOVING means a release request is in progress.
  FIP_STATE_REMOVING = 4;
}

// ---------------------------------------------------------------------------
// Shared sub-messages
// ---------------------------------------------------------------------------

// BackendRef is a single upstream endpoint the load balancer forwards to.
message BackendRef {
  string ip = 1 [(buf.validate.field).string.ip = true];
  int32 port = 2 [(buf.validate.field).int32 = { gte: 1, lte: 65535 }];
}

// HttpRoute defines HTTP-request-based routing rules (Gateway API HTTPRoute match).
// Only relevant when Protocol is HTTP. All fields are optional.
message HttpRoute {
  // host is the hostname to match (e.g., "api.example.com"). Empty = any host.
  string host = 1;
  // path is the HTTP path to match (e.g., "/api/v1/*"). Empty = any path.
  string path = 2;
  // path_type defines how the path should be matched.
  HttpPathType path_type = 3 [(buf.validate.field).enum.defined_only = true];
  // headers are the HTTP headers to match. All specified headers must match.
  map<string, string> headers = 4 [
    (buf.validate.field).map = {
      max_pairs: 50
      keys: { string: { min_len: 1 } }
      values: { string: { max_len: 1024 } }
    }
  ];
  // method is the HTTP method to match.
  HttpMethod method = 5 [(buf.validate.field).enum.defined_only = true];

  option (buf.validate.message).cel = {
    id: "hostname-valid"
    message: "host must be a valid hostname when not empty"
    expression: "this.host == '' || this.host.matches('^([a-zA-Z0-9-]+[.])+[a-zA-Z]{2,}$')"
  };
  option (buf.validate.message).cel = {
    id: "path-prefix-required"
    message: "path must start with '/' for Exact and Prefix path types"
    expression: "this.path == '' || this.path_type == 3 || this.path.startsWith('/')"
  };
}

// HealthMonitor defines active health check settings for backend endpoints.
message HealthMonitor {
  // interval is the time in seconds between successive health checks.
  int32 interval = 1 [(buf.validate.field).int32 = { gte: 1, lte: 3600 }];
  // timeout is the time in seconds to wait for a health check response.
  int32 timeout = 2 [(buf.validate.field).int32 = { gte: 1, lte: 300 }];
  // unhealthy_threshold is the number of consecutive failures before marking
  // a backend as unhealthy.
  int32 unhealthy_threshold = 3 [(buf.validate.field).int32.gt = 0];
  // healthy_threshold is the number of consecutive successes before marking
  // a backend as healthy again.
  int32 healthy_threshold = 4 [(buf.validate.field).int32.gt = 0];
  // http_health_check_path is the HTTP path used for health checks (only relevant when protocol=HTTP).
  // Default: "/"
  string http_health_check_path = 5;
  // http_health_check_method is the HTTP method used for health checks (only relevant when protocol=HTTP).
  // Default: GET
  HttpMethod http_health_check_method = 6 [(buf.validate.field).enum.defined_only = true];
  // expected_status_codes lists the HTTP status codes that indicate a healthy backend.
  // Example: [200, 201, 202]. Default: [200].
  repeated int32 expected_status_codes = 7;

  option (buf.validate.message).cel = {
    id: "timeout-less-than-interval"
    message: "timeout must be less than interval"
    expression: "this.timeout < this.interval"
  };
}

// Listener defines a single listener on a load balancer.
// Each listener has its own port, protocol, algorithm, backend refs,
// health monitor, TLS settings, and optionally an HTTP route (only relevant when protocol=HTTP).
message Listener {
  int32 port = 1 [(buf.validate.field).int32 = { gte: 1, lte: 65535 }];
  Protocol protocol = 2 [(buf.validate.field).enum.defined_only = true];
  // algorithm is required – defines how traffic is distributed across backends.
  Algorithm algorithm = 3 [(buf.validate.field).enum.defined_only = true];
  // backend_refs are the upstream endpoints for this listener.
  repeated BackendRef backend_refs = 4 [(buf.validate.field).repeated.min_items = 1];
  // http_route is optional. When set with Protocol=HTTP the routing rules are applied.
  optional HttpRoute http_route = 5;
  // health_monitor is optional. When set, active health checking is enabled.
  optional HealthMonitor health_monitor = 6;
  // id is a server-assigned UUID used to identify this listener (responses / update context).
  string id = 7;
  // tls_enabled controls whether TLS is enabled for this listener. Default: false.
  bool tls_enabled = 8;
  // tls_cert is the TLS certificate in PEM format. Required when tls_enabled is true.
  string tls_cert = 9;
  // tls_key is the TLS private key in PEM format. Required when tls_enabled is true.
  string tls_key = 10;

  option (buf.validate.message).cel = {
    id: "tls-cert-required"
    message: "TLS certificate and key are required when TLS is enabled"
    expression: "!this.tls_enabled || (this.tls_cert != '' && this.tls_key != '')"
  };
  option (buf.validate.message).cel = {
    id: "http-route-http-only"
    message: "HTTP route is only allowed for HTTP protocol listeners"
    expression: "!has(this.http_route) || this.protocol == 3"
  };
  option (buf.validate.message).cel = {
    id: "http-health-monitor-required"
    message: "health check path, method, and expected status codes are required when protocol is HTTP and health monitor is enabled"
    expression: "this.protocol != 3 || !has(this.health_monitor) || (this.health_monitor.http_health_check_path.startsWith('/') && this.health_monitor.http_health_check_method != 0 && size(this.health_monitor.expected_status_codes) > 0 && this.health_monitor.expected_status_codes.all(c, c >= 100 && c <= 599))"
  };
}

// LoadBalancerSpec captures the user-supplied configuration.
message LoadBalancerSpec {
  string tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  string network_id = 2 [(buf.validate.field).string.min_len = 1];
  string subnet_id = 3 [(buf.validate.field).string.min_len = 1];
  // listeners defines the set of ports and protocols this LB listens on.
  repeated Listener listeners = 4 [(buf.validate.field).repeated.min_items = 1];
  // client_conn_limit is the maximum number of simultaneous client connections.
  // 0 means unlimited (use the platform default, e.g. 1000).
  int32 client_conn_limit = 6 [(buf.validate.field).int32.gte = 0];
  // security_group_disabled controls whether a security group is applied.
  // When true, no security group is applied. When false with empty security_group_id, all traffic is blocked.
  bool security_group_disabled = 11;
  // security_group_id is the UUID of the security group to apply.
  // When security_group_disabled is false and this is empty, all traffic is blocked.
  string security_group_id = 12;
  // qos_policy_disabled controls whether a QoS policy is applied.
  // When true, no QoS policy is applied. When false with empty qos_policy_id, no QoS enforcement.
  bool qos_policy_disabled = 13;
  // qos_policy_id is the UUID of the OpenStack QoS policy to apply.
  // When qos_policy_disabled is false and this is empty, no QoS enforcement.
  string qos_policy_id = 14;

  option (buf.validate.message).cel = {
    id: "spec-id-uuid-format"
    message: "tenant_id, network_id, and subnet_id must be valid UUIDs (hex with optional dashes)"
    expression: "this.tenant_id.matches('^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$') && this.network_id.matches('^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$') && this.subnet_id.matches('^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$')"
  };
  option (buf.validate.message).cel = {
    id: "security-group-validation"
    message: "security_group_id must be a valid UUID when security is not disabled and id is non-empty"
    expression: "this.security_group_disabled || this.security_group_id == '' || this.security_group_id.matches('^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$')"
  };
  option (buf.validate.message).cel = {
    id: "qos-policy-validation"
    message: "qos_policy_id must be a valid UUID when QoS policy is enabled"
    expression: "this.qos_policy_disabled || this.qos_policy_id.matches('^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$')"
  };
}

// LoadBalancerSummary is the lightweight representation used in list responses.
message LoadBalancerSummary {
  string id = 1;
  string name = 2;
  // ip is empty until the external controller sets it.
  string ip = 3;
  State state = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Floating IP fields.
  bool fip_enabled = 11;
  string fip = 12;
  FipState fip_state = 13;
  // fip_network_id is the external network ID used when allocating the FIP.
  string fip_network_id = 14;
  // Security & limits.
  int32 client_conn_limit = 17;
  // listener_count is the number of listeners configured on this LB.
  int32 listener_count = 19;
  // Security group fields.
  bool security_group_disabled = 20;
  string security_group_id = 21;
  // QoS policy fields.
  bool qos_policy_disabled = 22;
  string qos_policy_id = 23;
}

// LoadBalancer is the full representation including spec and error details.
message LoadBalancer {
  string id = 1;
  string name = 2;
  // ip is the provisioned VIP address (only set when state is READY).
  string ip = 3;
  LoadBalancerSpec spec = 4;
  State state = 5;
  // error contains a human-readable message when state is FAILED.
  string error = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // Floating IP fields.
  bool fip_enabled = 9;
  string fip = 10;
  FipState fip_state = 11;
  // fip_network_id is the external network ID used when allocating the FIP.
  string fip_network_id = 12;
  // Security group fields.
  bool security_group_disabled = 13;
  string security_group_id = 14;
  // QoS policy fields.
  bool qos_policy_disabled = 15;
  string qos_policy_id = 16;
}

// ---------------------------------------------------------------------------
// Request / Response messages
// ---------------------------------------------------------------------------

message CreateLoadBalancerRequest {
  // name is a human-friendly label for the load balancer.
  string name = 1 [(buf.validate.field).string.max_len = 255];
  LoadBalancerSpec spec = 2 [(buf.validate.field).required = true];
  // fip is an optional floating IP to pre-assign during creation.
  // If non-empty, fip_state will be set to PROVISIONING after creation.
  optional string fip = 3;
  // fip_network_id is the external network ID for FIP allocation.
  // Required when fip field is set (i.e., FIP is enabled).
  optional string fip_network_id = 4 [(buf.validate.field).string.uuid = true];
  // idempotency_key prevents duplicate creation on retry.
  string idempotency_key = 5 [(buf.validate.field).string.uuid = true];

  option (buf.validate.message).cel = {
    id: "fip-ip-valid"
    message: "fip must be a valid IPv4 address when provided and non-empty"
    expression: "!has(this.fip) || this.fip == '' || this.fip.matches('^(?:[0-9]{1,3}\\\\.){3}[0-9]{1,3}$')"
  };
  option (buf.validate.message).cel = {
    id: "fip-network-required"
    message: "fip_network_id is required when fip is provided"
    expression: "!has(this.fip) || has(this.fip_network_id)"
  };
}

message CreateLoadBalancerResponse {
  // id is the database-assigned identifier.
  string id = 1;
  // state will always be PENDING on creation.
  State state = 2;
}

message GetLoadBalancerRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetLoadBalancerResponse {
  LoadBalancer load_balancer = 1;
}

message ListLoadBalancersRequest {
  // tenant_id optionally filters the results. Empty means return all.
  string tenant_id = 1;
  // page_size is the maximum number of items per page. Defaults to 50, max 200.
  int32 page_size = 2 [(buf.validate.field).int32 = { gte: 1, lte: 200 }];
  // page_token is an opaque cursor for pagination. Empty means first page.
  string page_token = 3;
}

message ListLoadBalancersResponse {
  repeated LoadBalancerSummary load_balancers = 1;
  // next_page_token is empty when this is the last page.
  string next_page_token = 2;
}

message DeleteLoadBalancerRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteLoadBalancerResponse {
  string id = 1;
  // state will always be DELETING immediately after this call.
  State state = 2;
}

message BatchDeleteLoadBalancersResult {
  string id = 1;
  bool succeeded = 2;
  string message = 3;
}

message BatchDeleteLoadBalancersRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = { min_items: 1, max_items: 100, items: { string: { uuid: true } } }
  ];
}

message BatchDeleteLoadBalancersResponse {
  repeated BatchDeleteLoadBalancersResult results = 1;
}

message AllocateFloatingIpRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // fip is the floating IP address to assign. Can be left empty to let the
  // infrastructure auto-assign an address.
  string fip = 2;
  // fip_network_id is the external network ID for FIP allocation. Required.
  string fip_network_id = 3 [(buf.validate.field).string.uuid = true];
}

message AllocateFloatingIpResponse {
  string id = 1;
  FipState fip_state = 2;
  string fip = 3;
}

message ReleaseFloatingIpRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ReleaseFloatingIpResponse {
  string id = 1;
  FipState fip_state = 2;
}

message UpdateLoadBalancerRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];

  // --- Listeners (full replacement) ---
  // Send the complete desired list of listeners. Existing listeners are
  // replaced entirely. Health monitor is per-listener.
  repeated Listener listeners = 2;

  // --- Traffic shaping ---
  optional int32 client_conn_limit = 9;

  // --- Security group ---
  // When present, security_group_disabled + security_group_id are applied as-is.
  optional bool security_group_disabled = 13;
  optional string security_group_id = 14;

  // --- QoS policy ---
  // When present, qos_policy_disabled + qos_policy_id are applied as-is.
  optional bool qos_policy_disabled = 15;
  optional string qos_policy_id = 16;

  option (buf.validate.message).cel = {
    id: "update-client-conn-limit"
    message: "client_conn_limit must be non-negative"
    expression: "!has(this.client_conn_limit) || this.client_conn_limit >= 0"
  };
  option (buf.validate.message).cel = {
    id: "update-security-group"
    message: "security_group_id must be a valid UUID when provided and not disabled"
    expression: "!has(this.security_group_disabled) || this.security_group_disabled || !has(this.security_group_id) || this.security_group_id == '' || this.security_group_id.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')"
  };
  option (buf.validate.message).cel = {
    id: "update-qos-policy"
    message: "qos_policy_id must be a valid UUID when QoS policy is enabled"
    expression: "!has(this.qos_policy_disabled) || this.qos_policy_disabled || (has(this.qos_policy_id) && this.qos_policy_id.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))"
  };
}

message UpdateLoadBalancerResponse {
  string id = 1;
  State state = 2;
}

