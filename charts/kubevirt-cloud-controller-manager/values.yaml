namespace: default

kubeconfig: |
  apiVersion: v1
  clusters:
  - cluster:
      insecure-skip-tls-verify: true
      server: https://10.3.3.158:6443
    name: kubernetes
  - cluster:
      insecure-skip-tls-verify: true
      server: ""
    name: local
  contexts:
  - context:
      cluster: kubernetes
      user: kubernetes-admin
    name: kubernetes-admin@kubernetes
  current-context: kubernetes-admin@kubernetes
  kind: Config
  preferences: {}
  users:
  - name: kubernetes-admin
    user:
      client-certificate-data: 
      client-key-data: 

image:
  repository: sumon124816/openstack
  tag: ccm
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits: {}

cloudConfig:
  loadBalancer:
    creationPollInterval: 5
    creationPollTimeout: 60
  instancesV2:
    enabled: true
    zoneAndRegionEnabled: false

rpcServerAddr: "10.2.3.250:9000"
rpcKeepAlive: 30
rpcRetryMax: 3
networkID: "6fdf82fd-659c-435b-9452-2677689229b5"
subnetID: "a6b34727-fd97-4085-ba63-7784195218a4"
fipNetworkID: "013234de-62ee-48ce-9c2b-cb0849b335a4"
tenantID: "b4e90e6f0982470ba5472483e82c7db8"

serviceAccount:
  create: true
  name: cloud-controller-manager

role:
  apiGroups:
    - kubevirt.io
  resources:
    - virtualmachines
    - virtualmachineinstances
  verbs:
    - get
    - watch
    - list
    - update
  nonResourceURLs: []

clusterName: "ccm"