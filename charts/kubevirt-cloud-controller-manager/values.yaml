image:
  repository: sumon124816/openstack
  tag: ccm
  pullPolicy: Always

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits: {}

cloudConfig:
  loadBalancer:
    creationPollInterval: 5
    creationPollTimeout: 120
  instancesV2:
    enabled: true
    zoneAndRegionEnabled: false

rpcServerAddr: "10.2.3.250:9000"
rpcKeepAlive: 30
rpcRetryMax: 3
networkID: "e31344bd-5840-4e67-b9f4-42f2d022655c"
subnetID: "34ae98d5-c02d-48f7-a525-19dc6ea10032"
fipNetworkID: "46a8ddf9-a531-4c81-9451-d221f59b19ea"
ipType: "external" # internal, external, both
tenantID: "8743f99e2933433e8cc1b760de8d63f0"

serviceAccount:
  create: true
  name: cloud-controller-manager

role:
  apiGroups:
    - kubevirt.io
  resources:
    - virtualmachines
    - virtualmachineinstances
  verbs:
    - get
    - watch
    - list
    - update
  nonResourceURLs: []

clusterName: "capi-slowstart"

# when true, disables node and route controllers, keeping only loadbalancer (service) + EPS controllers
onlyServiceController: false

# number of services to sync concurrently (default 1, set >1 for parallel LB creation)
concurrentServiceSyncs: 1

# API key for authenticating with the RPC server, empty = no auth
apiKey: ""