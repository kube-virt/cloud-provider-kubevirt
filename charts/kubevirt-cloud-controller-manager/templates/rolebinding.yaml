apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubevirt-cloud-controller-manager.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubevirt-cloud-controller-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubevirt-cloud-controller-manager.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "kubevirt-cloud-controller-manager.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}